# Public research MVP. One paid single-instance service with a private persistent disk.
# Secrets are generated by Render or supplied in the dashboard; never commit credentials.
services:
  - type: web
    name: cifra-practice-pilot
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: cifra-persistent-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_HTTPS_ONLY
        value: "true"
      - key: DEMO_MODE
        value: "false"
      - key: PERSISTENT_STORAGE_ROOT
        value: /var/data
      - key: DATABASE_URL
        value: sqlite:////var/data/cifra.sqlite3
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: BASE_URL
        fromService:
          name: cifra-practice-pilot
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: INITIAL_ADMIN_USERNAME
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_NAME
        value: Руководитель проекта Цифра